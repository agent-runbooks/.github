<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <!-- The loop of runbook-review-loop's flow.py and the status of one real run of it; a step's color links its call to its rows. -->
  <rect width="1600" height="700" fill="#0f1115"/>
  <g fill="#151820" stroke="#262b36" stroke-width="2">
    <rect x="72" y="48" width="720" height="560" rx="14"/>
    <rect x="832" y="48" width="696" height="560" rx="14"/>
  </g>
  <g stroke="#262b36" stroke-width="2">
    <line x1="72" y1="100" x2="792" y2="100"/>
    <line x1="832" y1="100" x2="1528" y2="100"/>
  </g>
  <g font-family="Menlo, ui-monospace, monospace" font-size="20">
    <text x="100" y="81" fill="#e7e5e4">flow.py</text>
    <text x="196" y="81" fill="#6b7280">runbook-review-loop</text>
    <text x="860" y="81" fill="#e7e5e4">20261031-slugify-max-length</text>
    <rect x="1206" y="62" width="74" height="28" rx="14" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80" stroke-width="1.5"/>
    <text x="1243" y="82" fill="#4ade80" text-anchor="middle" font-size="17">ready</text>
  </g>
  <g font-family="Menlo, ui-monospace, monospace" font-size="22" fill="#a8a29e">
    <text x="100" y="148"><tspan fill="#6b7280">@rb.flow</tspan></text>
    <text x="100" y="179"><tspan fill="#6b7280">def</tspan> main(ctx):</text>
    <text x="153.0" y="210"><tspan fill="#6b7280">yield</tspan> <tspan fill="#f5f5f4">implement()</tspan></text>
    <text x="153.0" y="241">budget, used = ctx.inputs.maxFixRounds, 0</text>
    <text x="153.0" y="272"><tspan fill="#6b7280">while</tspan> True:</text>
    <text x="206.0" y="303">r = <tspan fill="#6b7280">yield</tspan> <tspan fill="#8ab4f8">review()</tspan></text>
    <text x="206.0" y="334"><tspan fill="#6b7280">if</tspan> r.findings == 0:</text>
    <text x="259.0" y="365"><tspan fill="#6b7280">return</tspan> <tspan fill="#4ade80">end('ready', ...)</tspan></text>
    <text x="206.0" y="396"><tspan fill="#6b7280">if</tspan> used &gt;= budget:</text>
    <text x="259.0" y="427">a = <tspan fill="#6b7280">yield</tspan> <tspan fill="#facc15">ask_rounds()</tspan></text>
    <text x="259.0" y="458"><tspan fill="#6b7280">if</tspan> a.choice == 'stop':</text>
    <text x="311.9" y="489"><tspan fill="#6b7280">return</tspan> end('needs_attention', ...)</text>
    <text x="259.0" y="520">budget += a.rounds</text>
    <text x="206.0" y="551"><tspan fill="#6b7280">yield</tspan> <tspan fill="#c4a7e7">fix()</tspan></text>
    <text x="206.0" y="582">used += 1</text>
  </g>
  <g font-family="Menlo, ui-monospace, monospace" font-size="22">
    <g fill="#4ade80">
      <text x="860" y="152">✓</text><text x="860" y="196">✓</text><text x="860" y="240">✓</text><text x="860" y="284">✓</text>
      <text x="860" y="328">✓</text><text x="860" y="372">✓</text><text x="860" y="416">✓</text>
    </g>
    <text x="890" y="152" fill="#f5f5f4">implement</text>
    <text x="890" y="196" fill="#8ab4f8">review</text>
    <text x="890" y="240" fill="#c4a7e7">fix</text>
    <text x="890" y="284" fill="#8ab4f8">review#2</text>
    <text x="890" y="328" fill="#facc15">ask-rounds</text>
    <text x="890" y="372" fill="#c4a7e7">fix#2</text>
    <text x="890" y="416" fill="#8ab4f8">review#3</text>
    <g fill="#6b7280">
      <text x="1036" y="152">coder</text><text x="1036" y="196">reviewer</text><text x="1036" y="240">coder</text>
      <text x="1036" y="284">reviewer</text><text x="1036" y="328">you</text><text x="1036" y="372">coder</text><text x="1036" y="416">reviewer</text>
    </g>
    <g fill="#a8a29e">
      <text x="1156" y="152">1:30</text><text x="1156" y="196">1:24</text><text x="1156" y="240">0:57</text><text x="1156" y="284">1:06</text>
      <text x="1156" y="328">0:32</text><text x="1156" y="372">0:48</text><text x="1156" y="416">1:20</text>
    </g>
    <g fill="#6b7280">
      <text x="1226" y="196">findings: 1</text>
      <text x="1226" y="284">findings: 1</text>
      <text x="1226" y="328">one more round</text>
      <text x="1226" y="416">findings: 0</text>
    </g>
    <line x1="860" y1="462" x2="1500" y2="462" stroke="#262b36" stroke-width="2"/>
    <text x="860" y="510" fill="#4ade80">end: ready</text>
    <text x="860" y="550" fill="#a8a29e">read &lt;run&gt;/06-review.md, then commit</text>
  </g>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#a8a29e">
    <text x="72" y="658">flow.py decides which step comes next.</text>
    <text x="832" y="658">Your agent session runs each step as a subagent.</text>
  </g>
</svg>
